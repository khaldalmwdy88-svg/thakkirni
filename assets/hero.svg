<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <defs>
    <linearGradient id="cal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#151029"/>
    </linearGradient>
    <linearGradient id="calTop" x1="0" y1="0" x2="1" y2="0">
